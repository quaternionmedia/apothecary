version = 1
SPDX-PackageName = "apothecary"
SPDX-PackageSupplier = "Quaternion Media <peter.kagstrom@gmail.com>"
SPDX-PackageDownloadLocation = "https://github.com/quaternionmedia/apothecary"

# MIT throughout, as README.md and LICENSE state: people read that claim and
# rely on it, so nothing here declares another licence. The adoption-scope
# record (governance/qm/adr/DRAFT-constitution-adoption-scope.md, §2) has the
# reasoning.
#
# datum's hardware licensing record also builds on it: "The apothecary
# repository, whose parts library this project extends, is MIT."
#
# Declared here rather than as per-file headers because .scad and .j2 sources
# carry no convention for one, and the Python surface is large enough that
# headers would be noise rather than signal.

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright (c) 2026 Quaternion Media"
SPDX-License-Identifier = "MIT"

# three.js is somebody else's work, copied in so the viewer needs no network.
[[annotations]]
path = "apothecary/static/vendor/three/**"
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) 2010-2023 three.js authors"
SPDX-License-Identifier = "MIT"

# CodeMirror 6 and the packages it imports, likewise (its README says which and
# how to update them). The README and packages.json there are this project's.
[[annotations]]
path = ["apothecary/static/vendor/codemirror/*/index.js", "apothecary/static/vendor/codemirror/*/LICENSE"]
precedence = "override"
SPDX-FileCopyrightText = "Copyright (C) 2016-2024 Marijn Haverbeke and others"
SPDX-License-Identifier = "MIT"

# GoldenLayout 2.6.0, the page's windows: its build, stylesheets and icons, copied in
# (apothecary/static/vendor/golden-layout/README.md says how). The README and
# package.json there are this project's.
[[annotations]]
path = ["apothecary/static/vendor/golden-layout/**/*.js", "apothecary/static/vendor/golden-layout/css/*.css", "apothecary/static/vendor/golden-layout/img/*.png", "apothecary/static/vendor/golden-layout/LICENSE"]
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) 2016 deepstream.io"
SPDX-License-Identifier = "MIT"

