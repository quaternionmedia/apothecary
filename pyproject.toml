[project]
name = "apothecary"
version = "0.1.0"
description = "OpenSCAD generation toolkit + curated printable parts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.121.1",
    "jinja2>=3.1.6",
    "pydantic>=2.12.4",
    "click>=8.1.7",
    "uvicorn>=0.30.0",
    "playwright>=1.57.0",
]

[project.scripts]
apothecary = "apothecary.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.2",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.6",
    "playwright>=1.40.0",
    "pytest-playwright>=0.4.0",
    "ruff>=0.5.0",
    "black>=24.4.0",
    "pre-commit>=3.7.0",
    "pillow>=10.0.0",
]

[tool.uv]
package = true

[tool.setuptools]
packages = ["apothecary"]

[tool.pytest.ini_options]
# The walkthrough pages are executable. Named on the command line, not left to
# testpaths: pytest ignores testpaths the moment it receives a path argument,
# so a walkthrough reached only that way is one nobody runs.
addopts = "-q --doctest-glob=*.md"
testpaths = ["walkthrough", "tests"]
markers = [
    "e2e: end-to-end tests using Playwright",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "docs: e2e doc-workflow tests that generate docs/generated/ when run with --generate-docs",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Vendored third-party submodules are not ours to lint or restyle. Without
# this, gridfinity-rebuilt-openscad's own test suite supplies 88 of the 132
# errors a bare `ruff check .` reports, and black would rewrite files inside
# a submodule working tree -- which shows up as an unexplained dirty pin.
extend-exclude = ["parts/gridfinity/gridfinity-rebuilt-openscad"]
select = [
    "E", # pycodestyle errors
    "F", # pyflakes
    "I", # import sort
    "B", # bugbear
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "parts/gridfinity/gridfinity-rebuilt-openscad/"

[tool.coverage.run]
source = ["apothecary"]
omit = ["apothecary/projects/parts/*"]
