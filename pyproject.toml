[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "apothecary"
version = "0.1.0"
description = "OpenSCAD generation toolkit + curated printable parts"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.121.1",
    "jinja2>=3.1.6",
    "pydantic>=2.12.4",
    "click>=8.1.7",
    "uvicorn>=0.30.0",
    # Reading pixels for the shape finder; it runs on this machine only.
    "pillow>=10.0.0",
    # The byte transport under the G-code printer seam; see docs/firmware.md.
    "pyserial>=3.5",
]

[project.scripts]
apothecary = "apothecary.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.2",
    "pytest-cov>=4.1.0",
    # The browser tests and `apothecary docs generate`; not needed to run the app.
    "playwright>=1.57.0",
    "pytest-playwright>=0.4.0",
    "ruff>=0.5.0",
    "pytest-xdist>=3.8.0",
    "httpx2>=2.13.1",
]

# What `apothecary preflight` needs to run the workflows the way CI does. The
# workflows install their own tools with `python -m pip install ...`, and a
# uv-managed environment has no pip, so those steps fail for an environment
# reason rather than a real one.
#
#     uv run --group preflight apothecary preflight
preflight = [
    "pip",
    "pyyaml>=6.0",
    # The extra, not bare `reuse`: without it the package wants libmagic at
    # import time and dies before it lints anything. A Windows box has none.
    "reuse[charset-normalizer]>=3.0",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["apothecary*"]

[tool.setuptools.package-data]
# The viewer's scripts, styles and vendored three.js are served from the package.
apothecary = ["static/**/*"]

[tool.pytest.ini_options]
# The walkthrough pages are executable. Named on the command line, not left to
# testpaths: pytest ignores testpaths the moment it receives a path argument,
# so a walkthrough reached only that way is one nobody runs.
addopts = "-q --doctest-glob=*.md"
testpaths = ["walkthrough", "tests"]
# A deprecation in our own code is a failure now, not a warning nobody reads.
filterwarnings = ["error::DeprecationWarning:apothecary"]
markers = [
    "e2e: end-to-end tests using Playwright",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "docs: e2e doc-workflow tests that generate docs/generated/ when run with --generate-docs",
    "walkthrough: the one demonstration; it writes walkthrough/ and the ordinary test command runs it",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Vendored and submodule code is not ours to lint.
extend-exclude = ["parts/gridfinity/gridfinity-rebuilt-openscad", "governance/qm"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
# Line length is the formatter's business; the lint gate is for mistakes.
ignore = ["E501"]

[tool.coverage.run]
source = ["apothecary"]
omit = ["apothecary/projects/parts/*"]
