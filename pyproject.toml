[project]
name = "apothecary"
version = "0.1.0"
description = "OpenSCAD generation toolkit + curated printable parts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.121.1",
    "jinja2>=3.1.6",
    "pydantic>=2.12.4",
    "click>=8.1.7",
    "uvicorn>=0.30.0",
    "playwright>=1.57.0",
]

[project.scripts]
apothecary = "apothecary.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.2",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.6",
    "playwright>=1.40.0",
    "pytest-playwright>=0.4.0",
    "ruff>=0.5.0",
    "black>=24.4.0",
    "pre-commit>=3.7.0",
]

[tool.uv]
package = true

[tool.setuptools]
packages = ["apothecary"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["e2e: end-to-end tests using Playwright"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E", # pycodestyle errors
    "F", # pyflakes
    "I", # import sort
    "B", # bugbear
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.coverage.run]
source = ["apothecary"]
omit = ["apothecary/projects/parts/*"]
