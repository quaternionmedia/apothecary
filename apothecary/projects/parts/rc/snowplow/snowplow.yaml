# Snowplow Part Interface Metadata
#
# Each position and normal is in the frame of the component that carries the
# interface, at the default parameters: mount_left and mount_right in the
# mount plate's (SnowplowMount, centred on its origin), blade_edge in the
# blade's before blade_angle tilts it (SnowplowBlade, centred on its origin).
# snowplow_assembly puts the plate's origin at
# (0, mount_front_y(...) - mount_thickness / 2, mount_height / 2) of the part:
# on the bed, its front face against the blade's back face at the base.
interfaces:
  - name: mount_left
    type: bolt_hole
    version: "1.0"
    diameter: 3.0
    position: { x: -12, y: 0, z: 0 }
    normal: { x: 0, y: 1, z: 0 }
  - name: mount_right
    type: bolt_hole
    version: "1.0"
    diameter: 3.0
    position: { x: 12, y: 0, z: 0 }
    normal: { x: 0, y: 1, z: 0 }
  - name: blade_edge
    type: slot
    version: "1.0"
    width: 2.0
    length: 100.0
    position: { x: 0, y: 0, z: -22 }
    normal: { x: 0, y: 0, z: -1 }
