name: License check

# Enforcement path for the QM open-license-exclusion-and-upstream-remediation
# record (governance/qm/records/DRAFT-open-license-exclusion-and-upstream-remediation.md),
# §4: "a dependency-manifest report per package ecosystem for everything else."
# Apothecary ships no container image, so this is the dependency-manifest path,
# not the SBOM-per-image path (see adr/DRAFT-constitution-adoption-scope.md).
#
# `apothecary` itself is excluded from the scan: this audits third-party
# dependencies against the OSI/FSF allowlist, not the project's own
# (separately tracked) license metadata gap.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  license-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Enforce OSI/FSF allowlist and write the license report
        # A package outside the allowlist is named in the log and no report is written.
        run: |
          uv run --with pip-licenses pip-licenses \
            --format=json \
            --with-urls \
            --ignore-packages apothecary \
            --allow-only="MIT;MIT License;MIT-CMU;MIT AND Python-2.0;BSD License;BSD-2-Clause;BSD-3-Clause;Apache Software License;Apache-2.0;Apache Software License; BSD License;Apache Software License; MIT License;Mozilla Public License 2.0 (MPL 2.0);MPL-2.0;PSF-2.0;Python Software Foundation License;Unlicense;Artistic License; GNU General Public License (GPL); GNU General Public License v2 or later (GPLv2+)" \
            --output-file=licenses.json

      - name: Upload license report
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: licenses.json

      - name: No locked dependency has a known vulnerability
        # Audits uv.lock as exported, not the environment: apothecary itself is
        # not on PyPI, so a plain `pip-audit --strict` fails on it.
        run: |
          requirements=$(mktemp)
          uv export --no-hashes --no-emit-project --format requirements-txt > "$requirements"
          uv run --with pip-audit pip-audit --strict --disable-pip --no-deps -r "$requirements"
