name: 🧪 Test

on:
  push:
    branches:
    - main
    - 'release/**'
  pull_request:
    branches:
    - main
  workflow_call:
    inputs:
      python_version:
        description: The version of python to setup
        type: string
        default: 3.x

jobs:
  run_pytest:
    name: 🥼 Run test suite
    runs-on: ubuntu-latest
    
    steps:
    - name: 📰 Checkout
      uses: actions/checkout@v6
      with:
        # The gridfinity part is a wrapper around a vendored submodule. Without
        # its sources the part cannot render, and three tests fail on a
        # checkout that looks otherwise complete.
        submodules: true

    - name: 🐍 Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python_version }}

    - name: 😎 Setup uv
      uses: astral-sh/setup-uv@v7

    - name: 🚧 Install dependencies
      run: uv sync --locked --dev

    - name: 📐 Install OpenSCAD
      # The viewer E2E test asserts the page loads with no console errors. With
      # no openscad on PATH the STL endpoints answer 503 ("OpenSCAD not
      # installed") and the page fills with failed resource loads. A developer
      # machine hides this behind a populated .cache/ of previously rendered
      # STLs; a fresh checkout has none.
      run: sudo apt-get update && sudo apt-get install -y openscad

    - name: 🎭 Install Playwright browsers
      # `apothecary test all` runs the E2E phase unconditionally. Without a
      # browser that phase exits non-zero having collected nothing, which
      # until now was invisible because the runner swallowed the code.
      run: uv run playwright install --with-deps chromium

    - name: 📖 Run the walkthrough
      # Named explicitly rather than reached through testpaths: pytest ignores
      # testpaths the moment it receives a path argument, so a walkthrough
      # wired that way is one nobody runs and it stays green forever.
      run: uv run pytest walkthrough -q

    - name: 🔬 Unit tests
      run: uv run pytest tests -m "not e2e" -q --slow

    - name: 🎭 Browser tests
      # --start-server runs the app on state and pictures of its own (tests/e2e/conftest.py).
      run: uv run pytest tests/e2e --start-server -q

    - name: 📝 The committed walkthrough is the one this run wrote
      # Pages 11 and 12 are written by the browser run above. A diff means the
      # committed page describes a run that no longer happens.
      run: git diff --exit-code -- 'walkthrough/*.md'

    - name: 📦 The wheel installs and runs
      # A consumer pins a released version; what they get is the wheel, not this checkout.
      run: |
        uv build --wheel -o dist
        uv venv /tmp/wheel-venv
        VIRTUAL_ENV=/tmp/wheel-venv uv pip install dist/*.whl
        cd /tmp && /tmp/wheel-venv/bin/apothecary --help
        echo '{"objects":[{"type":"cube","size":{"x":1,"y":2,"z":3}}]}' > /tmp/scene.json
        /tmp/wheel-venv/bin/apothecary render --scene-file /tmp/scene.json -o /tmp/scene.scad
        grep -q "cube(\[1.0, 2.0, 3.0\]" /tmp/scene.scad
