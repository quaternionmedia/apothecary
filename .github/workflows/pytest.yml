name: 🧪 Test

# At a version tag, the claim a release makes, and on demand: the tests are run here
# before a pull request is ready, its body saying what ran (CONTRIBUTING.md), and a
# pull request's push runs the governance checks and lint alone.
on:
  push:
    tags:
    - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

# Each job's cap is twice its median over the runs GitHub records for it, set when
# those were last read (`gh api repos/quaternionmedia/apothecary/actions/runs/RUN/jobs`
# over the recent successful runs): not a number chosen to fit.

permissions:
  contents: read

jobs:
  unit:
    name: 🥼 Lint, walkthrough, unit tests and the wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 7

    steps:
    - name: 📰 Checkout
      uses: actions/checkout@v6
      with:
        # The gridfinity part renders from a vendored submodule.
        submodules: true

    - name: 😎 Setup uv
      uses: astral-sh/setup-uv@v7
      with:
        # The floor of requires-python.
        python-version: "3.11"

    - name: 📐 Install OpenSCAD
      # The tests that render an STL skip without it. A runner has none; a machine
      # running this workflow here (`apothecary preflight`) may have it already.
      run: command -v openscad || { sudo apt-get update && sudo apt-get install -y openscad; }

    - name: 🚧 Install dependencies
      run: uv sync --locked

    - name: 🗃️ Cache the OpenSCAD snapshot
      uses: actions/cache@v5
      with:
        path: ~/.apothecary/tools/openscad
        key: openscad-${{ runner.os }}-2026.09.27

    - name: 📐 An OpenSCAD snapshot for the unit tests
      # Ubuntu's OpenSCAD (2021.01) lists no parameters, writes no render summary and
      # has no Manifold, so the unit tests that need one of those skip with it alone;
      # with the snapshot every render here then uses, they run. The browser tests'
      # servers keep a tools folder of their own and render with the system's, as the
      # walkthrough's pages say. The date is pinned, and moved by hand when
      # files.openscad.org no longer serves it.
      run: uv run apothecary openscad install --snapshot 2026.09.27 --extract

    - name: 🧹 Lint
      run: uv run ruff check apothecary tests

    - name: 📖 Run the walkthrough
      # Named on the command line: pytest ignores testpaths once it is given a path.
      run: uv run pytest walkthrough -q

    - name: 🔬 Unit tests
      run: uv run pytest tests -m "not e2e" -q --slow

    - name: 📦 The wheel installs and runs
      # A consumer pins a released version; what they get is the wheel, not this checkout.
      run: |
        uv build --wheel -o dist
        uv venv --clear /tmp/wheel-venv
        VIRTUAL_ENV=/tmp/wheel-venv uv pip install dist/*.whl
        cd /tmp && /tmp/wheel-venv/bin/apothecary --help
        echo '{"objects":[{"type":"cube","size":{"x":1,"y":2,"z":3}}]}' > /tmp/scene.json
        /tmp/wheel-venv/bin/apothecary render --scene-file /tmp/scene.json -o /tmp/scene.scad
        grep -q "cube(\[1.0, 2.0, 3.0\]" /tmp/scene.scad

  # The newest Python, beside the floor: the unit tests and the walkthrough, which is
  # where a newer interpreter breaks things. Lint and the wheel are the floor's.
  unit-newest:
    name: 🐍 Walkthrough and unit tests on the newest Python
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
    - name: 📰 Checkout
      uses: actions/checkout@v6
      with:
        submodules: true

    - name: 😎 Setup uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: "3.14"

    - name: 📐 Install OpenSCAD
      run: command -v openscad || { sudo apt-get update && sudo apt-get install -y openscad; }

    - name: 🚧 Install dependencies
      run: uv sync --locked

    - name: 🗃️ Cache the OpenSCAD snapshot
      uses: actions/cache@v5
      with:
        path: ~/.apothecary/tools/openscad
        key: openscad-${{ runner.os }}-2026.09.27

    - name: 📐 An OpenSCAD snapshot for the unit tests
      run: uv run apothecary openscad install --snapshot 2026.09.27 --extract

    - name: 📖 Run the walkthrough
      run: uv run pytest walkthrough -q

    - name: 🔬 Unit tests
      run: uv run pytest tests -m "not e2e" -q --slow

  # Three runners, each a third of the suite by recorded time (tests/e2e/durations.json);
  # a file never splits, since the walkthroughs and the ring build on earlier steps.
  # Three jobs rather than a matrix, so `apothecary preflight` can run them here; the
  # steps are written once and shared by anchor.
  e2e-1:
    name: 🎭 Browser tests (1/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      SHARD: 1
    steps: &e2e-steps
    - name: 📰 Checkout
      uses: actions/checkout@v6
      with:
        submodules: true

    - name: 😎 Setup uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: "3.11"

    - name: 📐 Install OpenSCAD
      # Without it the STL endpoints answer 503 and the page logs failed loads.
      run: command -v openscad || { sudo apt-get update && sudo apt-get install -y openscad; }

    - name: 🚧 Install dependencies
      run: uv sync --locked

    - name: 🔖 Locked Playwright version
      id: playwright
      run: echo "version=$(uv run python -c 'from importlib.metadata import version; print(version("playwright"))')" >> "$GITHUB_OUTPUT"

    - name: 🗃️ Cache the Playwright browsers
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

    - name: 🎭 Install Chromium
      # On a runner --with-deps installs the system libraries, which the cache does not
      # hold; a machine running this here (`apothecary preflight`) runs Chromium already.
      run: |
        if [ "$GITHUB_ACTIONS" = true ]; then uv run playwright install --with-deps chromium
        else uv run playwright install chromium; fi

    - name: 🎭 Browser tests
      # --start-server runs the app on state and pictures of its own (tests/e2e/conftest.py).
      run: uv run pytest tests/e2e --start-server -q --shard "$SHARD"/3

    - name: 🖼️ Pictures that differ from the committed ones
      # A warning naming each walkthrough picture this shard wrote that differs from
      # the committed one past a tenth of a percent of its pixels; never a failure,
      # since a picture is judged against its caption by a person.
      if: ${{ !cancelled() }}
      run: uv run python tests/e2e/picture_drift.py

    - name: 📝 The committed walkthrough is the one this run wrote
      # The browser tests write the walkthrough pages they demonstrate.
      run: git diff --exit-code -- 'walkthrough/*.md'

  e2e-2:
    name: 🎭 Browser tests (2/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      SHARD: 2
    steps: *e2e-steps

  e2e-3:
    name: 🎭 Browser tests (3/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      SHARD: 3
    steps: *e2e-steps
