name: 🧪 Test

on:
  push:
    branches:
    - main
    - 'release/**'
  pull_request:
    branches:
    - main
  workflow_call:
    inputs:
      python_version:
        description: The version of python to setup
        type: string
        default: 3.x

jobs:
  run_pytest:
    name: 🥼 Run test suite
    runs-on: ubuntu-latest
    
    steps:
    - name: 📰 Checkout
      uses: actions/checkout@v6
      with:
        # The gridfinity part is a wrapper around a vendored submodule. Without
        # its sources the part cannot render, and three tests fail on a
        # checkout that looks otherwise complete.
        submodules: true

    - name: 🐍 Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python_version }}

    - name: 😎 Setup uv
      uses: astral-sh/setup-uv@v7

    - name: 🚧 Install dependencies
      run: uv sync --locked --dev

    - name: 📦 Install the viewer's JS dependencies
      # The fractal viewer serves three.js from this origin rather than a CDN,
      # so node_modules is a build prerequisite and not an optional extra.
      # Without it /vendor/three answers 404, the module script never runs, and
      # every viewer test fails against a page that looks loaded but is inert.
      # `npm ci` rather than `npm install`: the lockfile is committed and this
      # is the command that honours it.
      #
      # `--ignore-scripts` because @jscad/web's postInstall cannot resolve its
      # own `copy-dir` under ci's stricter install order and fails the step.
      # Nothing is lost: its dist ships in the tarball, verified present after
      # a scriptless install, and `three` -- the one this viewer serves -- has
      # no install script at all.
      run: npm ci --ignore-scripts

    - name: 📐 Install OpenSCAD
      # The viewer E2E test asserts the page loads with no console errors. With
      # no openscad on PATH the STL endpoints answer 503 ("OpenSCAD not
      # installed") and the page fills with failed resource loads. A developer
      # machine hides this behind a populated .cache/ of previously rendered
      # STLs; a fresh checkout has none.
      run: sudo apt-get update && sudo apt-get install -y openscad

    - name: 🎭 Install Playwright browsers
      # `apothecary test all` runs the E2E phase unconditionally. Without a
      # browser that phase exits non-zero having collected nothing, which
      # until now was invisible because the runner swallowed the code.
      run: uv run playwright install --with-deps chromium

    - name: 📖 Run the walkthrough
      # Named explicitly rather than reached through testpaths: pytest ignores
      # testpaths the moment it receives a path argument, so a walkthrough
      # wired that way is one nobody runs and it stays green forever.
      run: uv run pytest walkthrough -q

    - name: 🔬 Run test suite
      run: uv run apothecary test all
