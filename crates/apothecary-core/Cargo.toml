[package]
name = "apothecary-core"
description = "A Rust core inside Python (PyO3) for hot paths; not built yet"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The name Python imports. A cdylib is the shared library maturin would turn
# into a wheel; nothing here does yet.
name = "apothecary_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311"] }
